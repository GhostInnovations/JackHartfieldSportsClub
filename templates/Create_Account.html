<!DOCTYPE html>
<html>
<head>
    <title>Create Account – Jack Hartfield Sports Club</title>
    <link rel="stylesheet" href="../static/style.css">
</head>

<body>

    <nav class="navbar">
        <div class="logo">
            <img src="../static/images/Logo.jpg">
        </div>

        <ul>
            <li><a href="/Home">Home</a></li> 
            <li><a href="/Fitness_Center">Fitness Center</a></li> 
            <li><a href="/Membership">Membership</a></li> 
            <li><a href="/Room_Hire">Room Hire</a></li> 
            <li><a href="/Login">Login</a></li>
        </ul>
    </nav>

    <section class="login-section">
        <div class="login-box">
            <h1>Create Account</h1>

            <form>
                <label>Full Name</label>
                <input type="text" placeholder="Enter your full name" required>

                <label>Email</label>
                <input type="email" placeholder="Enter your email" required>

                <label>Password</label>
                <input type="password" placeholder="Create a password" required>

                <label>Confirm Password</label>
                <input type="password" placeholder="Re-enter your password" required>

                <button type="submit">Create Account</button>
            </form>

            <p class="signup-text">
                Already have an account?
                <a href="../templates/login.html">Login here</a>
            </p>
        </div>
    </section>

    <footer style="background-color: black; color: white;">
        <p>Made by Jacob at Ghost Innovations LTD</p>
    </footer>

</body>
</html>
